name: Android CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, and build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Android SDK 35
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Unit tests, lint, and APK builds
        shell: bash
        run: |
          mkdir -p build
          set -o pipefail
          ./gradlew --no-daemon --stacktrace \
            testDebugUnitTest lintDebug assembleDebug assembleRelease \
            2>&1 | tee build/ci-gradle.log

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: watch-instruments-ci-diagnostics
          path: |
            build/ci-gradle.log
            app/build/reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate APK checksums
        shell: bash
        run: |
          sha256sum \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            > app/build/outputs/apk/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: watch-instruments-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
