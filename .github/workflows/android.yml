name: Android CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bootstrap, test, lint, and build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Expand source package
        id: bootstrap
        shell: bash
        run: |
          if compgen -G ".bootstrap/source.part.*" > /dev/null; then
            cat .bootstrap/source.part.* > /tmp/watch-source.tar.xz
            echo "4c7d5c1eaece688fbddac16111fa1ec96c9cfe52e0e1bbd9ab287933bd3ba19c  /tmp/watch-source.tar.xz" | sha256sum -c -
            tar -xJf /tmp/watch-source.tar.xz
            rm -rf .bootstrap
            chmod +x gradlew
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat: add complete OPPO Watch instrument application"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Android SDK 35
        shell: bash
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Unit tests, lint, and APK builds
        run: >-
          ./gradlew --no-daemon --stacktrace
          testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Generate APK checksums
        shell: bash
        run: |
          sha256sum \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            > app/build/outputs/apk/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: watch-instruments-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
